# Runs entirely offline against the mock provider — no API keys needed.
# Use this to try the tool and sanity-check your task definitions before
# spending real API credits. See configs/real_experiment.example.yaml for
# a template with actual model providers.

experiment:
  name: "mock-smoke-test"
  runs_per_cell: 3
  temperature: 0.7
  conditions: [bare, minimal, engineered]

  models:
    - provider: mock
      model: mock-small
      label: "mock-small"
      generation_rank: 1
    - provider: mock
      model: mock-large
      label: "mock-large"
      generation_rank: 2

  tasks:
    - configs/tasks/math.yaml
    - configs/tasks/classification.yaml
    - configs/tasks/summarization.yaml
    - configs/tasks/extraction.yaml

  # The summarization task uses eval.method: llm_judge, so a judge is
  # required. Using the mock provider as judge too keeps this fully
  # offline — its scores aren't meaningful, only its plumbing is tested.
  judge:
    provider: mock
    model: mock-judge

  output:
    db_path: results/mock_results.db
    report_path: results/mock_report.html
